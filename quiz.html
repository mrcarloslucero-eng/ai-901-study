<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-901 Practice Quiz</title>
<style>
  :root {
    color-scheme: dark;
    --accent: #4da3e8; --accent-light: #1c2a3a; --text: #e6edf3; --muted: #98a6b5;
    --border: #2d3745; --bg: #12161d; --card: #1b212b;
    --correct: #6cc16c; --correct-bg: #1d3320;
    --wrong: #e07070; --wrong-bg: #3a2022;
  }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", -apple-system, Arial, sans-serif; color: var(--text);
         background: var(--bg); margin: 0; line-height: 1.6; }
  .container { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.6rem; color: var(--accent); border-bottom: 3px solid var(--accent);
       padding-bottom: 0.5rem; margin-top: 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
          padding: 1.5rem; margin: 1rem 0; }
  .controls label { display: block; font-weight: 600; margin: 0.75rem 0 0.25rem; }
  .controls select { padding: 0.4rem 0.6rem; font-size: 1rem; border: 1px solid var(--border);
                     border-radius: 6px; background: var(--card); }
  button { background: var(--accent); color: #fff; border: none; border-radius: 6px;
           padding: 0.55rem 1.4rem; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
  button:hover { filter: brightness(1.1); }
  button.secondary { background: var(--card); color: var(--accent); border: 1px solid var(--accent); }
  .qmeta { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.5rem; }
  .qtext { font-weight: 600; font-size: 1.05rem; margin-bottom: 1rem; }
  .opt { display: block; border: 1px solid var(--border); border-radius: 6px;
         padding: 0.6rem 0.9rem; margin: 0.45rem 0; cursor: pointer; background: var(--card); }
  .opt:hover { border-color: var(--accent); background: var(--accent-light); }
  .opt.correct { border-color: var(--correct); background: var(--correct-bg); font-weight: 600; }
  .opt.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .opt.locked { cursor: default; }
  .expl { border-left: 4px solid var(--accent); background: var(--accent-light);
          padding: 0.6rem 1rem; margin-top: 0.75rem; border-radius: 0 6px 6px 0; font-size: 0.92rem; }
  .progress { color: var(--muted); font-size: 0.9rem; }
  .result-num { font-size: 2rem; font-weight: 700; color: var(--accent); }
  .domain-row { display: flex; justify-content: space-between; padding: 0.4rem 0;
                border-bottom: 1px solid var(--border); }
</style>
</head>
<body>
<div class="container">
  <h1>AI-901 Practice Quiz</h1>
  <p class="progress">Questions are shuffled (both order and answer positions) every run — same as <code>quiz.py</code>. Pass mark on the real exam: 70%.</p>

  <div id="setup" class="card controls">
    <label for="count">Number of questions</label>
    <select id="count">
      <option value="10">10</option>
      <option value="20" selected>20</option>
      <option value="40">40</option>
      <option value="0">All 200</option>
    </select>
    <label for="domain">Domain</label>
    <select id="domain">
      <option value="">All domains</option>
      <option value="Identify AI concepts and capabilities">Identify AI concepts and capabilities</option>
      <option value="Implement AI solutions by using Microsoft Foundry">Implement AI solutions by using Microsoft Foundry</option>
    </select>
    <br><button id="startBtn">Start quiz</button>
  </div>

  <div id="quiz" style="display:none">
    <div class="card">
      <div class="qmeta" id="qmeta"></div>
      <div class="qtext" id="qtext"></div>
      <div id="opts"></div>
      <div id="expl"></div>
      <button id="nextBtn" style="display:none">Next question</button>
    </div>
  </div>

  <div id="results" style="display:none">
    <div class="card">
      <div class="result-num" id="scoreLine"></div>
      <p id="verdict"></p>
      <h3>Performance by domain</h3>
      <div id="domainBreakdown"></div>
      <br><button class="secondary" id="retryBtn">Try another run</button>
    </div>
  </div>
</div>

<script>
const DATA = {"domains": ["Identify AI concepts and capabilities", "Implement AI solutions by using Microsoft Foundry"], "bank": [{"id": 1, "domain": "Identify AI concepts and capabilities", "q": "A loan-approval model gives noticeably worse accuracy for applicants from one postal code region. Which responsible AI principle is most directly violated?", "options": ["Fairness", "Accountability", "Transparency", "Inclusiveness"], "answer": 0, "explanation": "Unequal accuracy across groups is a fairness problem, usually caused by biased training data."}, {"id": 2, "domain": "Identify AI concepts and capabilities", "q": "A chatbot tells every user at the start of a conversation: 'You are speaking with an AI assistant.' Which principle does this support?", "options": ["Reliability and safety", "Transparency", "Privacy and security", "Fairness"], "answer": 1, "explanation": "Disclosing that users are interacting with AI is a transparency requirement."}, {"id": 3, "domain": "Identify AI concepts and capabilities", "q": "A company requires a human reviewer to approve every AI-generated insurance claim decision before payment. Which principle does the human-in-the-loop step primarily support?", "options": ["Inclusiveness", "Accountability", "Transparency", "Privacy and security"], "answer": 1, "explanation": "Accountability means people remain answerable for AI-driven decisions; human review is a classic accountability control."}, {"id": 4, "domain": "Identify AI concepts and capabilities", "q": "A speech-to-text service is tuned so that it recognizes voices with a wide range of accents, ages, and speech patterns equally well. Which principle is being applied?", "options": ["Inclusiveness", "Reliability and safety", "Fairness", "Transparency"], "answer": 0, "explanation": "Designing so the system works for people of diverse abilities and backgrounds is inclusiveness."}, {"id": 5, "domain": "Identify AI concepts and capabilities", "q": "A generative model occasionally produces confident but factually wrong answers. Which principle is most at risk?", "options": ["Privacy and security", "Reliability and safety", "Inclusiveness", "Accountability"], "answer": 1, "explanation": "Hallucinations undermine reliability and safety — the system must behave correctly and safely even when uncertain."}, {"id": 6, "domain": "Identify AI concepts and capabilities", "q": "A model is trained on customer support transcripts that contain personal data. The team encrypts the data, restricts access, and removes identifying details. Which principle do these actions support?", "options": ["Transparency", "Fairness", "Privacy and security", "Accountability"], "answer": 2, "explanation": "Protecting data through encryption, access control, and de-identification addresses privacy and security."}, {"id": 7, "domain": "Identify AI concepts and capabilities", "q": "Which practice best demonstrates the fairness principle when building an image-classification model?", "options": ["Using the largest training dataset available", "Evaluating accuracy across different demographic groups and correcting gaps", "Publishing the model's source code", "Adding a disclaimer that the AI may make mistakes"], "answer": 1, "explanation": "Fairness is verified by measuring performance across groups and mitigating disparities."}, {"id": 8, "domain": "Identify AI concepts and capabilities", "q": "A manufacturer documents who approved an AI model for production, what data trained it, and how its outputs are monitored. This governance work primarily supports which principle?", "options": ["Accountability", "Privacy and security", "Inclusiveness", "Reliability and safety"], "answer": 0, "explanation": "Clear ownership, approval trails, and oversight are the mechanics of accountability."}, {"id": 9, "domain": "Identify AI concepts and capabilities", "q": "A vision system for self-checkout works for wheelchair users because the camera height and UI were tested with them during design. Which principle does this describe?", "options": ["Inclusiveness", "Transparency", "Fairness", "Reliability and safety"], "answer": 0, "explanation": "Involving people of all abilities in design and testing is inclusiveness in practice."}, {"id": 10, "domain": "Identify AI concepts and capabilities", "q": "A company publishes a card explaining what its AI service does, its intended uses, its limitations, and how it was evaluated. This supports which principle?", "options": ["Transparency", "Privacy and security", "Accountability", "Inclusiveness"], "answer": 0, "explanation": "Documentation of capabilities and limitations makes the system transparent to users and stakeholders."}, {"id": 11, "domain": "Identify AI concepts and capabilities", "q": "Which scenario is a privacy and security concern rather than a fairness concern?", "options": ["A model predicts one group less accurately", "A model memorizes and can regurgitate personal data from its training set", "A model refuses to respond in some languages", "A model's decision process cannot be inspected"], "answer": 1, "explanation": "Memorizing and leaking personal training data is a privacy and security failure."}, {"id": 12, "domain": "Identify AI concepts and capabilities", "q": "A support agent chatbot is restricted so it cannot provide medical dosing advice, and it politely declines out-of-scope requests. Which principle does the restriction most support?", "options": ["Reliability and safety", "Inclusiveness", "Transparency", "Fairness"], "answer": 0, "explanation": "Preventing harmful or unsafe outputs is a reliability and safety control."}, {"id": 13, "domain": "Identify AI concepts and capabilities", "q": "Which statement about responsible AI principles is correct?", "options": ["Only large enterprises are expected to follow them", "They are six principles: fairness, reliability and safety, privacy and security, inclusiveness, transparency, and accountability", "They apply only to computer vision systems", "They are legally binding regulations in all countries"], "answer": 1, "explanation": "Microsoft's framework has exactly six principles; they are guidance, not automatically law."}, {"id": 14, "domain": "Identify AI concepts and capabilities", "q": "An AI resume-screening tool was trained on ten years of past hiring data in which men were hired more often. The model learns to favor male candidates. This is primarily a failure of which principle?", "options": ["Privacy and security", "Fairness", "Accountability", "Transparency"], "answer": 1, "explanation": "Historical bias in training data producing discriminatory outcomes is a fairness failure."}, {"id": 15, "domain": "Identify AI concepts and capabilities", "q": "A hospital deploys an AI triage assistant but keeps clinicians as the final decision makers with a clear escalation path. Which two principles are most demonstrated?", "options": ["Accountability and reliability and safety", "Fairness and inclusiveness", "Transparency and privacy and security", "Inclusiveness and accountability"], "answer": 0, "explanation": "Human oversight keeps accountability, and clinical guardrails protect safety."}, {"id": 16, "domain": "Identify AI concepts and capabilities", "q": "Which action best improves the transparency of a customer-facing AI feature?", "options": ["Hiding the fact that AI is used to increase trust", "Labeling AI-generated content and explaining how decisions are made", "Reducing model size", "Removing all logs"], "answer": 1, "explanation": "Transparency means users know AI is involved and can understand how outputs arise."}, {"id": 17, "domain": "Identify AI concepts and capabilities", "q": "A team tests its speech model specifically with users who have speech impairments and adjusts it based on the results. Which principle drives this work?", "options": ["Fairness", "Inclusiveness", "Accountability", "Privacy and security"], "answer": 1, "explanation": "Ensuring the system works for people with diverse abilities is inclusiveness."}, {"id": 18, "domain": "Identify AI concepts and capabilities", "q": "Which of the following is a reliability and safety measure for a generative AI app?", "options": ["Grounding responses on retrieved company documents and adding content filters", "Publishing training data publicly", "Using the same model for every language", "Removing human oversight"], "answer": 0, "explanation": "Grounding and content filtering reduce incorrect or harmful outputs — reliability and safety controls."}, {"id": 19, "domain": "Identify AI concepts and capabilities", "q": "A regulator asks a bank to explain why an AI system denied a specific customer's application. Which principle makes this possible?", "options": ["Accountability", "Transparency", "Fairness", "Privacy and security"], "answer": 1, "explanation": "Being able to explain how a decision was reached is transparency; being answerable for it is accountability."}, {"id": 20, "domain": "Identify AI concepts and capabilities", "q": "A data scientist notices a model performs poorly on rare disease cases because they are underrepresented in the data. Improving representation primarily supports which principle?", "options": ["Fairness", "Transparency", "Reliability and safety", "Accountability"], "answer": 0, "explanation": "Unequal performance caused by unrepresentative data is a fairness issue."}, {"id": 21, "domain": "Identify AI concepts and capabilities", "q": "Which practice supports accountability across an AI system's lifecycle?", "options": ["Keeping an audit trail of model versions, approvals, and monitoring results", "Deleting logs after each deployment", "Allowing any employee to deploy models without review", "Using anonymous models with no named owner"], "answer": 0, "explanation": "Audit trails and clear ownership are how accountability is implemented in practice."}, {"id": 22, "domain": "Identify AI concepts and capabilities", "q": "A company stores user chat transcripts to improve its model but does not inform users. Which principle is most clearly violated?", "options": ["Privacy and security", "Inclusiveness", "Fairness", "Reliability and safety"], "answer": 0, "explanation": "Collecting and using personal data without notice or consent violates privacy expectations."}, {"id": 23, "domain": "Identify AI concepts and capabilities", "q": "A safety filter blocks an image-generation model from producing violent content. An attacker tries prompt tricks to bypass it. The system's resistance to such bypass attempts is tested under which principle?", "options": ["Reliability and safety", "Inclusiveness", "Transparency", "Fairness"], "answer": 0, "explanation": "Adversarial robustness of safeguards falls under reliability and safety."}, {"id": 24, "domain": "Identify AI concepts and capabilities", "q": "Which pairing of principle and example is correct?", "options": ["Inclusiveness — informing users that a call is with a bot", "Privacy and security — encrypting customer data at rest", "Accountability — balancing accuracy across age groups", "Fairness — naming an executive responsible for the AI system"], "answer": 1, "explanation": "Encrypting data at rest is a privacy and security practice; the other three pair examples with the wrong principles."}, {"id": 25, "domain": "Identify AI concepts and capabilities", "q": "A model's accuracy drops sharply when input images are slightly rotated or have different lighting. Strengthening the system against this kind of fragility supports which principle?", "options": ["Reliability and safety", "Inclusiveness", "Transparency", "Accountability"], "answer": 0, "explanation": "Consistent correct behavior under varied real-world conditions is reliability."}, {"id": 26, "domain": "Identify AI concepts and capabilities", "q": "At a high level, how does a large language model generate a response?", "options": ["It searches a database for the exact answer", "It predicts likely output tokens one at a time based on its training and the input so far", "It applies hand-written business rules", "It copies the closest document it was trained on"], "answer": 1, "explanation": "LLMs generate text by sequentially predicting tokens; that's why outputs are probabilistic and can vary."}, {"id": 27, "domain": "Identify AI concepts and capabilities", "q": "In Foundry, what is a model 'deployment'?", "options": ["A fine-tuned copy of the model's weights", "A named, hosted instance of a model that your apps call via an endpoint", "A GitHub release of the model", "A region where the model was originally trained"], "answer": 1, "explanation": "A deployment is a hosted, named instance of a model in your project, with its own endpoint and settings."}, {"id": 28, "domain": "Identify AI concepts and capabilities", "q": "Which parameter, when increased, makes a language model's output more varied and creative?", "options": ["Max output tokens", "Temperature", "Deployment name", "Timeout"], "answer": 1, "explanation": "Higher temperature increases randomness in token selection; lower temperature makes output more deterministic."}, {"id": 29, "domain": "Identify AI concepts and capabilities", "q": "You need the model to answer with at most 100 words. Which setting controls this?", "options": ["Top_p", "Temperature", "Max output tokens", "System prompt"], "answer": 2, "explanation": "The max output tokens parameter caps response length (approximately, by tokens rather than words)."}, {"id": 30, "domain": "Identify AI concepts and capabilities", "q": "What is a 'token' in the context of language models?", "options": ["An authentication key", "A unit of text, often a word or piece of a word, that the model processes", "A hardware accelerator", "A saved chat conversation"], "answer": 1, "explanation": "Models read and generate text as tokens; usage and limits are measured in tokens."}, {"id": 31, "domain": "Identify AI concepts and capabilities", "q": "You are building an app where users upload a photo and ask questions about it. Which model capability do you need?", "options": ["Text-only generation", "Multimodal (vision + language) input", "Speech synthesis", "Keyword extraction"], "answer": 1, "explanation": "Interpreting images in prompts requires a multimodal model that accepts visual input."}, {"id": 32, "domain": "Identify AI concepts and capabilities", "q": "Which choice of model is most appropriate for a high-volume, simple summarization task where cost matters more than peak quality?", "options": ["The largest frontier reasoning model", "A small, fast mini-tier model", "An image-generation model", "An embedding-only model"], "answer": 1, "explanation": "Small models are cheaper and faster and are sufficient for simple tasks like basic summarization."}, {"id": 33, "domain": "Identify AI concepts and capabilities", "q": "What does a 'system prompt' (system message) do in a generative AI app?", "options": ["Stores the user's previous questions", "Defines the model's role, behavior, and rules for the session", "Measures token usage", "Encrypts the conversation"], "answer": 1, "explanation": "The system prompt sets persistent instructions such as persona, rules, and output format."}, {"id": 34, "domain": "Identify AI concepts and capabilities", "q": "Your chatbot must always answer in valid JSON with specific keys. Which prompting technique most reliably achieves this?", "options": ["Increasing temperature", "Specifying the exact JSON schema in the system prompt, with an example", "Asking politely in the user message only", "Using a larger max token limit"], "answer": 1, "explanation": "Defining the required format and giving an example in the system prompt is the effective pattern."}, {"id": 35, "domain": "Identify AI concepts and capabilities", "q": "Which statement about generative AI model outputs is true?", "options": ["The same prompt always returns the identical response", "Outputs are probabilistic, so the same prompt can yield different responses", "Models retrieve answers from a fixed answer table", "Models cannot be configured to reduce randomness"], "answer": 1, "explanation": "Generation is probabilistic; temperature and top_p let you tune how much outputs vary."}, {"id": 36, "domain": "Identify AI concepts and capabilities", "q": "You must classify support tickets as Billing, Technical, or Other, and nothing else. Which prompt design helps most?", "options": ["List the allowed categories in the system prompt and instruct the model to reply with exactly one", "Raise the temperature for flexibility", "Ask the model to write a long explanation first", "Set max tokens to 500"], "answer": 0, "explanation": "Constraining outputs to an explicit, closed set in the system prompt is the standard classification pattern."}, {"id": 37, "domain": "Identify AI concepts and capabilities", "q": "What is 'top_p' (nucleus sampling) used for?", "options": ["Limiting how many users can call the model", "Controlling the diversity of generated text by sampling from the most likely tokens", "Encrypting prompts", "Choosing the model's deployment region"], "answer": 1, "explanation": "top_p restricts generation to a probability mass of likely tokens, another diversity control alongside temperature."}, {"id": 38, "domain": "Identify AI concepts and capabilities", "q": "Which is an appropriate reason to choose a multimodal model over a text-only model?", "options": ["The app must describe charts shown in screenshots", "The app only summarizes plain text", "You need to synthesize speech from text", "You need to extract invoice fields with a template"], "answer": 0, "explanation": "Describing charts in images requires vision understanding; the others don't require multimodal input."}, {"id": 39, "domain": "Identify AI concepts and capabilities", "q": "In the Foundry SDK, what identifies the specific deployed model your code calls?", "options": ["The model deployment name you configured in the project", "Your Azure subscription ID", "The model publisher's name", "The resource group name"], "answer": 0, "explanation": "Code passes the deployment name (e.g. gpt-5-mini) as the model identifier on each call."}, {"id": 40, "domain": "Identify AI concepts and capabilities", "q": "You want consistent, deterministic-ish output for extracting structured data. How should you set temperature?", "options": ["High (near 1.0)", "Low (near 0)", "It cannot be set", "Temperature only affects images"], "answer": 1, "explanation": "Low temperature minimizes randomness — the right choice for structured extraction tasks."}, {"id": 41, "domain": "Identify AI concepts and capabilities", "q": "What is 'context window' for a language model?", "options": ["The number of concurrent users supported", "The maximum amount of text (prompt plus response) the model can process in one request", "The region the model runs in", "The number of fine-tuning epochs"], "answer": 1, "explanation": "The context window bounds the combined input and output tokens per request."}, {"id": 42, "domain": "Identify AI concepts and capabilities", "q": "Which pairing of model type and use case is correct?", "options": ["Embedding model — generating an original short story", "Image-generation model — creating an illustration from a text description", "Speech recognition model — converting text into an audio file", "Chat model — converting an audio file into text"], "answer": 1, "explanation": "Image-generation models produce new visuals from descriptions; the other pairings are mismatched."}, {"id": 43, "domain": "Identify AI concepts and capabilities", "q": "Few-shot prompting means:", "options": ["Training the model from scratch on new data", "Including a few examples of the desired input/output pattern in the prompt", "Limiting the model to few tokens", "Deploying the model in a few regions"], "answer": 1, "explanation": "Few-shot prompting demonstrates the pattern with examples inside the prompt itself, without retraining."}, {"id": 44, "domain": "Identify AI concepts and capabilities", "q": "Which configuration change would most directly reduce a model's tendency to go off-topic in a support bot?", "options": ["Increasing max tokens", "Strengthening the system prompt with explicit scope and refusal rules", "Increasing temperature", "Renaming the deployment"], "answer": 1, "explanation": "Clear system-prompt instructions with scope limits and refusal guidance keep behavior on-topic."}, {"id": 45, "domain": "Identify AI concepts and capabilities", "q": "A developer needs to keep the cost of each request low. Which combination helps most?", "options": ["A smaller model deployment plus concise prompts and a max-token cap", "A larger model with longer prompts", "Raising temperature", "Adding more chat history per request"], "answer": 0, "explanation": "Cost scales with model tier and tokens processed, so small models plus tight prompts and caps reduce cost."}, {"id": 46, "domain": "Identify AI concepts and capabilities", "q": "Which statement about model deployment options in Foundry is accurate?", "options": ["Models can only be deployed to your own GPUs", "Foundry offers a catalog of models you deploy into your project and call via an endpoint", "Deployment requires exporting the model weights", "Each deployment must use a different programming language"], "answer": 1, "explanation": "You pick a model from the catalog, deploy it in your project, and call its endpoint via SDK, CLI, or REST."}, {"id": 47, "domain": "Identify AI concepts and capabilities", "q": "For a legal-document assistant, the answers must cite the company's own policy documents, not the model's general knowledge. What is this technique called?", "options": ["Fine-tuning", "Grounding (retrieval-augmented generation)", "Prompt chaining", "Model distillation"], "answer": 1, "explanation": "RAG grounds model responses in retrieved, authoritative content."}, {"id": 48, "domain": "Identify AI concepts and capabilities", "q": "Which factor does NOT affect the quality of a model's response?", "options": ["The clarity of the system prompt", "The temperature setting", "The color theme of the Foundry portal", "Whether relevant context is included in the prompt"], "answer": 2, "explanation": "UI theme has no effect; prompting, parameters, and context do."}, {"id": 49, "domain": "Identify AI concepts and capabilities", "q": "Your prompt asks: 'Write a product description. Here are two example descriptions in our brand voice.' This is an example of:", "options": ["Fine-tuning", "Few-shot prompting", "Content filtering", "System-generated metadata"], "answer": 1, "explanation": "Providing example outputs in the prompt is few-shot prompting."}, {"id": 50, "domain": "Identify AI concepts and capabilities", "q": "Which model capability would you select to convert meeting audio into a written transcript?", "options": ["Speech recognition (speech to text)", "Speech synthesis", "Image analysis", "Text generation"], "answer": 0, "explanation": "Transcribing audio to text is speech recognition."}, {"id": 51, "domain": "Identify AI concepts and capabilities", "q": "A news app extracts people, organizations, and locations mentioned in articles. Which text analysis technique is this?", "options": ["Sentiment analysis", "Named entity recognition", "Summarization", "Key phrase extraction"], "answer": 1, "explanation": "Detecting people, places, and organizations is named entity recognition (NER)."}, {"id": 52, "domain": "Identify AI concepts and capabilities", "q": "A retailer wants to know whether product reviews are positive, negative, or neutral. Which technique applies?", "options": ["Entity detection", "Keyword extraction", "Sentiment analysis", "Translation"], "answer": 2, "explanation": "Classifying text opinion as positive/negative/neutral is sentiment analysis."}, {"id": 53, "domain": "Identify AI concepts and capabilities", "q": "You need to pull the most important words and phrases from a long document to build a search index. Which technique fits?", "options": ["Key phrase (keyword) extraction", "Sentiment analysis", "Speech synthesis", "Image captioning"], "answer": 0, "explanation": "Keyword/key phrase extraction surfaces the dominant terms in text."}, {"id": 54, "domain": "Identify AI concepts and capabilities", "q": "A team needs a two-paragraph digest of every 40-page report. Which workload is this?", "options": ["Summarization", "Entity recognition", "Image generation", "Speech recognition"], "answer": 0, "explanation": "Producing a shorter version of content while keeping key meaning is summarization."}, {"id": 55, "domain": "Identify AI concepts and capabilities", "q": "A call center wants to automatically transcribe thousands of recorded support calls. Which capability is required?", "options": ["Speech synthesis", "Speech recognition (speech to text)", "Optical character recognition", "Text to speech"], "answer": 1, "explanation": "Converting spoken audio into text is speech recognition."}, {"id": 56, "domain": "Identify AI concepts and capabilities", "q": "An app reads typed text aloud for users with visual impairment. Which capability is required?", "options": ["Speech to text", "Speech synthesis (text to speech)", "Language detection", "OCR"], "answer": 1, "explanation": "Generating natural spoken audio from text is speech synthesis."}, {"id": 57, "domain": "Identify AI concepts and capabilities", "q": "A parking app reads license plate numbers from camera images. Which workload is this?", "options": ["Computer vision (image analysis)", "Sentiment analysis", "Speech recognition", "Summarization"], "answer": 0, "explanation": "Extracting information from images is a computer vision workload."}, {"id": 58, "domain": "Identify AI concepts and capabilities", "q": "A marketing team wants original illustrations generated from written style descriptions. Which capability applies?", "options": ["Image-generation models", "Image classification", "OCR", "Speech synthesis"], "answer": 0, "explanation": "Creating new images from text prompts is generative image modeling."}, {"id": 59, "domain": "Identify AI concepts and capabilities", "q": "A hospital processes patient intake forms, extracting names, dates, and diagnosis codes from scanned PDFs. Which workload is this?", "options": ["Information extraction from documents", "Speech synthesis", "Image generation", "Sentiment analysis"], "answer": 0, "explanation": "Pulling structured fields from forms and documents is an information extraction workload."}, {"id": 60, "domain": "Identify AI concepts and capabilities", "q": "An assistant answers customer questions, looks up order status via an API, and can file refund requests autonomously. Which kind of AI system is this?", "options": ["A simple text classifier", "An agentic AI solution", "An image-generation model", "A speech synthesizer"], "answer": 1, "explanation": "Agents combine a model with tools and can take multi-step actions toward goals."}, {"id": 61, "domain": "Identify AI concepts and capabilities", "q": "Which pair correctly matches workload and example?", "options": ["Speech synthesis — transcribing a lecture", "Computer vision — detecting defects in product photos", "Sentiment analysis — converting text to speech", "Image generation — extracting invoice totals"], "answer": 1, "explanation": "Detecting defects in photos is computer vision; the other pairs are mismatched."}, {"id": 62, "domain": "Identify AI concepts and capabilities", "q": "A video platform wants searchable transcripts and chapter summaries for uploaded videos. Which combination of capabilities applies?", "options": ["Speech recognition and summarization", "Image generation and OCR", "Sentiment analysis and translation", "Object detection and speech synthesis"], "answer": 0, "explanation": "Transcribe the audio (speech recognition), then condense it (summarization)."}, {"id": 63, "domain": "Identify AI concepts and capabilities", "q": "A chatbot for a bank answers questions  "explanation": "Deterministic arithmetic checks don't need probabilistic generation; generative AI is the wrong tool."}, {"id": 68, "domain": "Identify AI concepts and capabilities", "q": "A smart speaker must respond to spoken questions with spoken answers. Which pipeline is correct?", "options": ["Speech recognition then response generation then speech synthesis", "Speech synthesis then OCR then text analysis", "Image captioning then translation", "Sentiment analysis then OCR"], "answer": 0, "explanation": "Convert speech to text, generate the reply, then convert text back to speech."}, {"id": 69, "domain": "Identify AI concepts and capabilities", "q": "An HR system needs to detect names, dates, and addresses in resumes so they can be redacted. Which techniques apply?", "options": ["Entity detection (NER) on text", "Image generation", "Speech synthesis", "Object detection"], "answer": 0, "explanation": "Locating names, dates, and addresses is named entity recognition."}, {"id": 70, "domain": "Identify AI concepts and capabilities", "q": "A wildlife camera must count and classify animals in photos. Which vision capability is this?", "options": ["Object detection", "Speech recognition", "Sentiment analysis", "Text to speech"], "answer": 0, "explanation": "Locating and labeling objects within images is object detection."}, {"id": 71, "domain": "Identify AI concepts and capabilities", "q": "Which is an example of information extraction from audio?", "options": ["Pulling action items and speaker names from a recorded meeting", "Generating a landscape painting", "Detecting cats in photos", "Classifying a review as positive"], "answer": 0, "explanation": "Extracting structured details from recorded audio is audio information extraction."}, {"id": 72, "domain": "Identify AI concepts and capabilities", "q": "Which is an example of information extraction from video?", "options": ["Identifying key scenes, on-screen text, and topics in a recorded webinar", "Generating a new  77, "domain": "Identify AI concepts and capabilities", "q": "Which task fits an agent (agentic AI) rather than a single model call?", "options": ["Translating one sentence", "Booking a flight: search options, compare prices, reserve, and send confirmation", "Classifying one image", "Summarizing one paragraph"], "answer": 1, "explanation": "Multi-step tasks with tool use and decisions are agentic workloads."}, {"id": 78, "domain": "Identify AI concepts and capabilities", "q": "A document process needs OCR of scans plus understanding of clause meaning. Which pairing applies?", "options": ["Vision-based extraction plus text analysis", "Speech synthesis plus OCR", "Sentiment analysis plus image generation", "Object detection plus translation"], "answer": 0, "explanation": "Extract text from images with OCR, then analyze meaning with text analysis."}, {"id": 79, "domain": "Identify AI concepts and capabilities", "q": "Which statement about speech recognition is true?", "options": ["It can transcribe real-time audio and can separate speakers (diarization)", "It converts text into audio files", "It generates images from speech", "It only works with pre-recorded files"], "answer": 0, "explanation": "Speech to text supports real-time and batch transcription, with diarization in many configurations."}, {"id": 80, "domain": "Identify AI concepts and capabilities", "q": "Which statement about speech synthesis is true?", "options": ["Modern neural voices sound natural, with adjustable speaking style and rate", "It converts audio recordings into text", "It cannot be used in applications", "It only produces robotic voices"], "answer": 0, "explanation": "Neural text-to-speech produces natural voices with controllable style, pitch, and rate."}, {"id": 81, "domain": "Identify AI concepts and capabilities", "q": "Given a photo of a store shelf, a system lists every visible product. Which capability fits?", "options": ["Object detection", "Sentiment analysis", "Speech recognition", "Key phrase extraction"], "answer": 0, "explanation": "Detecting and labeling each object in an image is object detection."}, {"id": 82, "domain": "Identify AI concepts and capabilities", "q": "Which scenario combines computer vision and generative AI?", "options": ["Analyzing an uploaded product photo and writing a marketing caption for it", "Converting a PDF to plain text", "Transcribing a phone call", "Classifying an email as spam"], "answer": 0, "explanation": "Understanding the image (vision) and creating new text (generation) combine both."}, {"id": 83, "domain": "Identify AI concepts and capabilities", "q": "A healthcare provider wants to flag urgent messages in nurse notes. Which technique is most appropriate?", "options": ["Text classification on the notes", "Image generation", "Speech synthesis", "Object detection"], "answer": 0, "explanation": "Assigning severity/category labels to text is text classification."}, {"id": 84, "domain": "Identify AI concepts and capabilities", "q": "An accessibility feature describes photos aloud. Which pipeline is correct?", "options": ["Image analysis/captioning, then speech synthesis", "Speech recognition, then OCR", "OCR, then image generation", "Sentiment analysis, then translation"], "answer": 0, "explanation": "Generate a caption from the image, then speak it with text to speech."}, {"id": 85, "domain": "Identify AI concepts and capabilities", "q": "Which of these is NOT a common text analysis technique?", "options": ["Keyword extraction", "Entity detection", "Sentiment analysis", "Voxel rendering"], "answer": 3, "explanation": "Voxel rendering is a 3D graphics technique, not text analysis."}, {"id": 86, "domain": "Identify AI concepts and capabilities", "q": "A company wants automatic alt text for thousands of catalog images. Which capability is needed?", "options": ["Image captioning (vision plus language)", "Speech synthesis", "Keyword extraction only", "Language detection"], "answer": 0, "explanation": "Producing te age generation."}, {"id": 92, "domain": "Identify AI concepts and capabilities", "q": "A compliance team must find every mention of personal data in call recordings. Which pipeline fits?", "options": ["Speech to text, then entity detection on the transcript", "Speech synthesis, then OCR", "Image analysis, then translation", "Object detection, then summarization"], "answer": 0, "explanation": "Transcribe the audio, then run entity detection on the transcript."}, {"id": 93, "domain": "Identify AI concepts and capabilities", "q": "Which task needs a multimodal model rather than a dedicated OCR service?", "options": ["Answering 'What is funny about this meme?' given the image", "Reading a clean printed table into CSV", "Converting speech to text", "Detecting sentiment in reviews"], "answer": 0, "explanation": "Interpreting nuance and humor in an image needs multimodal reasoning."}, {"id": 94, "domain": "Identify AI concepts and capabilities", "q": "A company wants to summarize 10,000 customer emails weekly. Which capability applies?", "options": ["Text summarization", "Speech synthesis", "Object detection", "Image generation"], "answer": 0, "explanation": "Condensing text documents is summarization."}, {"id": 95, "domain": "Identify AI concepts and capabilities", "q": "Which contrast between generative and predictive AI is correct?", "options": ["Generative AI creates new content; predictive AI forecasts or classifies from patterns", "Generative AI only works on numbers", "They are identical", "Predictive AI creates content; generative AI classifies"], "answer": 0, "explanation": "Generation produces novel content; prediction/classification assigns labels or values."}, {"id": 96, "domain": "Identify AI concepts and capabilities", "q": "A smart speaker that plays your requested song primarily uses which capability to understand you?", "options": ["Speech recognition", "Speech synthesis", "Sentiment analysis", "OCR"], "answer": 0, "explanation": "Understanding spoken inpu let questions = [], idx = 0, score = 0;
const tally = {};  // domain -> {right, total}

const $ = id => document.getElementById(id);

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function start() {
  const n = parseInt($("count").value, 10);
  const d = $("domain").value;
  const pool = DATA.bank.filter(q => !d || q.domain === d);
  questions = shuffle(pool.slice());
  if (n > 0) questions = questions.slice(0, n);
  if (!questions.length) { alert("No questions match that filter."); return; }
  idx = 0; score = 0;
  for (const k in tally) delete tally[k];
  $("setup").style.display = "none";
  $("results").style.display = "none";
  $("quiz").style.display = "block";
  showQuestion();
}

function showQuestion() {
  const q = questions[idx];
  $("qmeta").textContent = "Question " + (idx + 1) + " of " + questions.length + " — " + q.domain;
  $("qtext").textContent = q.q;
  $("expl").innerHTML = "";
  $("nextBtn").style.display = "none";

  // shuffle option order; find the correct option text from the original index
  const opts = shuffle(q.options.slice());
  const correctText = q.options[q.answer];
  const letters = "ABCDEFGH";
  const box = $("opts");
  box.innerHTML = "";
  opts.forEach((text, i) => {
    const el = document.createElement("div");
    el.className = "opt";
    el.textContent = letters[i] + ". " + text;
    el.onclick = () => answer(el, text === correctText, q);
    box.appendChild(el);
  });
}

function answer(el, isRight, q) {
  const correctText = q.options[q.answer];
  for (const o of $("opts").children) {
    o.classList.add("locked");
    if (o.textContent.slice(2).trim() === correctText) o.classList.add("correct");
  }
  if (!isRight) el.classList.add("wrong");
  else score++;

  if (!tally[q.domain]) tally[q.domain] = { right: 0, total: 0 };
  tally[q.domain].total++;
  if (isRight) tally[q.domain].right++;

  const ex = $("expl");
  ex.innerHTML = "";
  const div = document.createElement("div");
  div.className = "expl";
  div.textContent = (isRight ? "Correct. " : "Wrong. ") + q.explanation;
  ex.appendChild(div);

  $("nextBtn").style.display = "inline-block";
  $("nextBtn").textContent = idx + 1 < questions.length ? "Next question" : "See results";
}

$("nextBtn").onclick = () => {
  idx++;
  if (idx < questions.length) showQuestion(); else finish();
};

function finish() {
  $("quiz").style.display = "none";
  $("results").style.display = "block";
  const pct = Math.round(100 * score / questions.length);
  $("scoreLine").textContent = score + " / " + questions.length + "  (" + pct + "%)";
  $("verdict").textContent = pct >= 70
    ? "Above the 70% pass mark. Keep drilling until you're at 85%+."
    : "Below the 70% pass mark — review the weakest domains below and run another set.";
  const bd = $("domainBreakdown");
  bd.innerHTML = "";
  Object.entries(tally)
    .sort((a, b) => (a[1].right / a[1].total) - (b[1].right / b[1].total))
    .forEach(([d, t]) => {
      const row = document.createElement("div");
      row.className = "domain-row";
      const pctD = Math.round(100 * t.right / t.total);
      row.innerHTML = "<span>" + d + "</span><span>" + t.right + "/" + t.total + " (" + pctD + "%)</span>";
      bd.appendChild(row);
    });
}

$("startBtn").onclick = start;
$("retryBtn").onclick = () => { $("results").style.display = "none"; $("setup").style.display = "block"; };
</script>
</body>
</html>
